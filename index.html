<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Playground — Paulsen</title>
  <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('pg-theme') === 'dark' ? 'dark' : 'light');</script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:            #fafaf9;
      --card-bg:       #ffffff;
      --card-border:   #e7e5e4;
      --card-border-h: #a8a29e;
      --card-icon-bg:  #f5f5f4;
      --text:          #1c1917;
      --muted:         #78716c;
    }

    html[data-theme="dark"] {
      --bg:            #0c0a09;
      --card-bg:       #292524;
      --card-border:   #44403c;
      --card-border-h: #78716c;
      --card-icon-bg:  #44403c;
      --text:          #fafaf9;
      --muted:         #d6d3d1;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', ui-sans-serif, system-ui, sans-serif;
      padding: 0 32px 64px;
    }

    .page {
      max-width: 1140px;
      margin: 0 auto;
      padding-top: 48px;
    }

    .page-header {
      margin-bottom: 48px;
    }

    .page-header h1 {
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .page-header p {
      margin-top: 8px;
      font-size: 0.95rem;
      color: var(--muted);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    /* Tablet */
    @media (min-width: 640px) and (max-width: 1024px) {
      body { padding: 0 24px 64px; }
      .page { padding-top: 40px; }
      .grid { grid-template-columns: repeat(2, 1fr); }
    }

    /* Mobile */
    @media (max-width: 639px) {
      body { padding: 0 16px 48px; }
      .page { padding-top: 32px; }
      .page-header { margin-bottom: 32px; }
      .page-header h1 { font-size: 1.5rem; }
      .grid { grid-template-columns: 1fr; }
    }

    .card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 28px;
      transition: border-color .15s, transform .15s;
    }

    .card:hover {
      border-color: var(--card-border-h);
      transform: translateY(-2px);
    }

    .card-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--card-icon-bg);
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    .card h2 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }

    .card p {
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="page-header">
      <h1>Playground</h1>
      <p>Things made with Claude.</p>
    </div>

    <div class="grid">
      <a class="card" href="Claude/Wave/Wave.html">
        <div class="card-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 13a2 2 0 0 0 2-2V7a2 2 0 0 1 4 0v13a2 2 0 0 0 4 0V4a2 2 0 0 1 4 0v13a2 2 0 0 0 4 0v-4a2 2 0 0 1 2-2" />
          </svg>
        </div>
        <h2>Wave</h2>
        <p>Interactive wave animation with tweakable parameters.</p>
      </a>
    </div>
  </div>

  <script src="/header.js"></script>
</body>
</html>
