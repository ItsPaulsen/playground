<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Playground — Paulsen</title>
  <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('pg-theme') === 'dark' ? 'dark' : 'light');</script>
  <link rel="stylesheet" href="/shared/tokens.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--pg-bg);
      color: var(--pg-primary);
      font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
    }

    .page {
      max-width: 1140px;
      margin: 0 auto;
      padding: 48px 32px 64px;
    }

    .page-header {
      margin-bottom: 40px;
      position: relative;
    }

    .page-header h1 {
      font-size: 48px;
      font-weight: 500;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .page-header p {
      margin-top: 8px;
      font-size: 18px;
      color: var(--pg-muted);
      line-height: 1.6;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .card h2 {
      font-size: 24px;
      font-weight: 500;
      color: var(--pg-primary);
      margin-bottom: 6px;
      line-height: 1.2;
    }

    .card p {
      font-size: 16px;
      color: var(--pg-muted);
      line-height: 1.5;
    }

    /* Tablet */
    @media (min-width: 640px) and (max-width: 1024px) {
      .page { padding: 40px 24px 64px; }
      .page-header { margin-bottom: 32px; }
      .page-header h1 { font-size: 40px; }
      .page-header p { font-size: 16px; }
      .card h2 { font-size: 22px; }
      .card p { font-size: 14px; }
      .grid { grid-template-columns: repeat(2, 1fr); }
    }

    /* Mobile */
    @media (max-width: 639px) {
      .page { padding: 32px 16px 48px; }
      .page-header { margin-bottom: 24px; }
      .page-header h1 { font-size: 32px; }
      .page-header p { font-size: 14px; }
      .card h2 { font-size: 20px; }
      .card p { font-size: 14px; }
      .grid { grid-template-columns: 1fr; }
    }

    .card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: var(--pg-surface);
      border-radius: 28px;
      padding: 28px;
      transition: transform .4s cubic-bezier(.25,.46,.45,.94),
                  box-shadow .4s cubic-bezier(.25,.46,.45,.94);
    }

    .card:hover {
      transform: scale(1.02);
    }

    .card-icon {
      width: 40px;
      height: 40px;
      border-radius: 16px;
      background: var(--card-icon-bg);
      color: var(--card-icon-color);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    .card-icon--indigo { background: #dbeafe; color: #1e40af; }
    html[data-theme="dark"] .card-icon--indigo { background: #1e3a8a; color: #93c5fd; }
    .card-icon--purple { background: #f3e8ff; color: #6b21a8; }
    html[data-theme="dark"] .card-icon--purple { background: #581c87; color: #d8b4fe; }
    .card-icon--red { background: #fee2e2; color: #991b1b; }
    html[data-theme="dark"] .card-icon--red { background: #7f1d1d; color: #fca5a5; }

  </style>
</head>
<body>
  <div class="page">
    <div class="page-header">
<h1>Playground</h1>
      <p>Vibes with Claude <svg width="16" height="16" viewBox="0 0 28 28" fill="#D97706" aria-hidden="true" style="display:inline-block;vertical-align:-2px"><path d="M14 2.5a1.5 1.5 0 0 1 1.5 1.5v7.63l6.61-3.82a1.5 1.5 0 1 1 1.5 2.6L17 14l6.61 3.82a1.5 1.5 0 1 1-1.5 2.6L15.5 16.37V24a1.5 1.5 0 0 1-3 0v-7.63l-6.61 3.82a1.5 1.5 0 1 1-1.5-2.6L11 14 4.39 10.18a1.5 1.5 0 0 1 1.5-2.6L12.5 11.63V4A1.5 1.5 0 0 1 14 2.5z"/></svg></p>
    </div>

    <div class="grid">
      <a class="card" href="wave/">
        <div class="card-icon card-icon--indigo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: rotate(90deg)">
            <path d="M2 13a2 2 0 0 0 2-2V7a2 2 0 0 1 4 0v13a2 2 0 0 0 4 0V4a2 2 0 0 1 4 0v13a2 2 0 0 0 4 0v-4a2 2 0 0 1 2-2" />
          </svg>
        </div>
        <h2>Wave</h2>
        <p>Interactive wave animation with tweakable parameters.</p>
      </a>

      <a class="card" href="typo/">
        <div class="card-icon card-icon--purple">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/>
          </svg>
        </div>
        <h2>Typo</h2>
        <p>Animated typography with tweakable font controls.</p>
      </a>

      <a class="card" href="mesh/">
        <div class="card-icon card-icon--red">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="9" cy="12" r="6"/><circle cx="15" cy="12" r="6"/>
          </svg>
        </div>
        <h2>Mesh</h2>
        <p>Animated mesh gradient with tweakable color points.</p>
      </a>

    </div>
  </div>

  <footer style="position:fixed;bottom:20px;right:24px;">
    <a href="style/" style="font-size:12px;color:var(--pg-muted);text-decoration:none;">Style</a>
  </footer>

  <script src="/header.js"></script>
</body>
</html>
