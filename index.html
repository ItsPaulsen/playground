<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Playground — Paulsen</title>
  <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('pg-theme') === 'dark' ? 'dark' : 'light');</script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:            #f5f5f4;
      --card-bg:       #ffffff;
      --card-border:   #e7e5e4;
      --card-border-h: #a8a29e;
      --card-icon-bg:  #dbeafe;
      --card-icon-color: #1e40af;
      --text:          #1c1917;
      --muted:         #78716c;
    }

    html[data-theme="dark"] {
      --bg:            #0c0a09;
      --card-bg:       #292524;
      --card-border:   #44403c;
      --card-border-h: #78716c;
      --card-icon-bg:  #1e3a8a;
      --card-icon-color: #93c5fd;
      --text:          #fafaf9;
      --muted:         #d6d3d1;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
      padding: 0 32px 64px;
    }

    .page {
      max-width: 1140px;
      margin: 0 auto;
      padding-top: 48px;
    }

    .page-header {
      margin-bottom: 40px;
      position: relative;
    }

    .page-header h1 {
      font-size: 48px;
      font-weight: 500;
      letter-spacing: -0.02em;
    }

    .page-header p {
      margin-top: 8px;
      font-size: 18px;
      color: var(--muted);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .card h2 {
      font-size: 24px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 6px;
    }

    .card p {
      font-size: 16px;
      color: var(--muted);
      line-height: 1.5;
    }

    /* Tablet */
    @media (min-width: 640px) and (max-width: 1024px) {
      body { padding: 0 24px 64px; }
      .page { padding-top: 40px; }
      .page-header { margin-bottom: 32px; }
      .page-header h1 { font-size: 40px; }
      .page-header p { font-size: 16px; }
      .card h2 { font-size: 22px; }
      .card p { font-size: 14px; }
      .grid { grid-template-columns: repeat(2, 1fr); }
    }

    /* Mobile */
    @media (max-width: 639px) {
      body { padding: 0 16px 48px; }
      .page { padding-top: 32px; }
      .page-header { margin-bottom: 24px; }
      .page-header h1 { font-size: 32px; }
      .page-header p { font-size: 14px; }
      .card h2 { font-size: 20px; }
      .card p { font-size: 14px; }
      .grid { grid-template-columns: 1fr; }
    }

    .card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: var(--card-bg);
      border-radius: 28px;
      padding: 28px;
      transition: transform .4s cubic-bezier(.25,.46,.45,.94),
                  box-shadow .4s cubic-bezier(.25,.46,.45,.94);
    }

    .card:hover {
      transform: scale(1.02);
    }

    .card-icon {
      width: 40px;
      height: 40px;
      border-radius: 16px;
      background: var(--card-icon-bg);
      color: var(--card-icon-color);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

  </style>
</head>
<body>
  <div class="page">
    <div class="page-header">
<h1>Playground</h1>
      <p>Stuff made with Claude <svg width="16" height="16" viewBox="0 0 28 28" fill="#D97706" aria-hidden="true" style="display:inline-block;vertical-align:-2px"><path d="M14 2.5a1.5 1.5 0 0 1 1.5 1.5v7.63l6.61-3.82a1.5 1.5 0 1 1 1.5 2.6L17 14l6.61 3.82a1.5 1.5 0 1 1-1.5 2.6L15.5 16.37V24a1.5 1.5 0 0 1-3 0v-7.63l-6.61 3.82a1.5 1.5 0 1 1-1.5-2.6L11 14 4.39 10.18a1.5 1.5 0 0 1 1.5-2.6L12.5 11.63V4A1.5 1.5 0 0 1 14 2.5z"/></svg></p>
    </div>

    <div class="grid">
      <a class="card" href="Claude/Wave/Wave.html">
        <div class="card-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: rotate(90deg)">
            <path d="M2 13a2 2 0 0 0 2-2V7a2 2 0 0 1 4 0v13a2 2 0 0 0 4 0V4a2 2 0 0 1 4 0v13a2 2 0 0 0 4 0v-4a2 2 0 0 1 2-2" />
          </svg>
        </div>
        <h2>Wave</h2>
        <p>Interactive wave animation with tweakable parameters.</p>
      </a>
    </div>
  </div>

  <script src="/header.js"></script>
</body>
</html>
