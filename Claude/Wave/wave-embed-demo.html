<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wave — embed demo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; background: #fff9f0; color: #f0ece3; }

  /* ── hero: full-viewport wave background ── */
  .hero {
    position: relative;
    width: 100%;
    height: 100vh;
    display: flex; align-items: center; justify-content: center;
    /* wave-embed.js appends a canvas here automatically */
  }
  .hero-content {
    position: relative; z-index: 1;
    text-align: center; padding: 24px;
  }
  .hero h1 { font-size: 88px; font-weight: 500; letter-spacing: -.02em; color: #402f1f; }
  .hero p  { margin-top: 12px; font-size: 20px; line-height: 32px; font-weight: 300; color: #776c5d; }
  @media (min-width: 768px) and (max-width: 1024px) {
    .hero h1 { font-size: 64px; }
  }
  @media (max-width: 767px) {
    .hero h1 { font-size: 48px; }
    .hero p { font-size: 16px; line-height: 24px; }
  }
</style>
</head>
<body>

<section class="hero" id="hero">
  <div class="hero-content">
    <h1>Wave</h1>
    <p>Drop wave-embed.js on any page — no framework.</p>
  </div>
</section>

<script src="wave-embed.js"></script>
<script>
  new WaveAnimation(document.getElementById('hero'), {
    lineCount:    16,
    thickness:    1,
    spacing:      12,
    amplitude:    0.24,
    frequency:    4,
    complexity:   1,
    turbulence:   0.2,
    speed:        1,
    opacity:      1,
    centerOffset: 0,
    spread:       0,
    fray:         0.04,
    softness:     true,
    direction:    'vertical',
    colorMode:    'fade-edges',
    blendMode:    'source-over',
    lineColor:    '#bcc3fb',
    bgColor:      '#fff9f0',
    accentColor:  '#7a5ae0',
    pulseAmount:  2,
    pulseRatio:   0.5,
    pulseSpeed:   0.5,
    seed:         19,
  });
</script>
</body>
</html>
