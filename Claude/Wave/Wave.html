<!doctype html>
<html lang="en" data-page="wave">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wave — Paulsen</title>
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('pg-theme') === 'dark' ? 'dark' : 'light');</script>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #faf8f3; overflow: hidden;
    font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }
  html[data-theme="dark"] body { background: #0c0a09; }
  #root, .stage { position: fixed; inset: 0; }
  .stage { display: block; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="wave.jsx"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "lineCount": 16,
  "thickness": 1,
  "spacing": 12,
  "amplitude": 0.25,
  "frequency": 4,
  "turbulence": 0.2,
  "speed": 1,
  "centerOffset": -0.18,
  "fray": 0.04,
  "direction": "vertical",
  "lineColor": "#bcc3fb",
  "pulseAmount": 2,
  "pulseRatio": 0.5,
  "pulseSpeed": 0.5,
  "seed": 19
}/*EDITMODE-END*/;

const ACCENT_COLORS = ["#c64a2a", "#2a6fdb", "#1f8a5b", "#7a5ae0", "#d49423", "#000000", "#ffffff"];

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [panelOpen, setPanelOpen] = React.useState(true);

  const rand = (min, max, step = 0.01) => {
    const v = Math.random() * (max - min) + min;
    return Math.round(v / step) * step;
  };
  const randomize = () => setTweak({
    seed:        rand(0, 50, 1),
    lineCount:   rand(1, 100, 1),
    thickness:   rand(0.5, 2, 0.5),
    spacing:     rand(1, 24, 1),
    amplitude:   rand(0, 1, 0.05),
    frequency:   rand(0.5, 10, 0.1),
    turbulence:  rand(0, 1, 0.01),
    fray:        rand(0, 1, 0.01),
    pulseAmount: rand(0, 6, 0.5),
    pulseRatio:  rand(0, 1, 0.01),
    pulseSpeed:  rand(0.5, 2, 0.5),
  });

  return (
    <>
      <Wave t={{
        lineCount: t.lineCount,
        thickness: t.thickness,
        spacing: t.spacing,
        amplitude: t.amplitude,
        frequency: t.frequency,
        complexity: 1,
        turbulence: t.turbulence,
        speed: t.speed,
        opacity: 1,
        centerOffset: panelOpen ? -0.18 : 0,
        softness: true,
        paused: false,
        direction: t.direction,
        colorMode: 'fade-edges',
        blendMode: 'source-over',
        lineColor: t.lineColor,
        spread: 0,
        fray: t.fray,
        pulseAmount: t.pulseAmount,
        pulseRatio: t.pulseRatio,
        pulseSpeed: t.pulseSpeed,
        seed: t.seed,
      }} />

      <TweaksPanel title="Wave" onOpenChange={setPanelOpen}>
        <TweakSection>
          <TweakColor value={t.lineColor}
                      onChange={(v) => setTweak('lineColor', v)} />
          <TweakRadio value={t.direction}
                      options={[{value:'vertical',label:'Vertical'},{value:'horizontal',label:'Horizontal'}]}
                      onChange={(v) => setTweak('direction', v)} />
          <div style={{display:'flex', gap:8}}>
            <TweakButton label="Randomize" secondary onClick={randomize} />
            <TweakButton label="Default" secondary
                         onClick={() => setTweak(TWEAK_DEFAULTS)} />
          </div>
        </TweakSection>

        <TweakSection label="Composition">
          <TweakSlider label="Lines" value={t.lineCount} min={1} max={100} step={1}
                       onChange={(v) => setTweak('lineCount', v)} />
          <TweakSlider label="Thickness" value={Number(t.thickness.toFixed(2))} min={0.25} max={2} step={0.25} unit="px"
                       onChange={(v) => setTweak('thickness', v)} />
          <TweakSlider label="Spacing" value={t.spacing} min={1} max={24} step={1} unit="px"
                       onChange={(v) => setTweak('spacing', v)} />
        </TweakSection>

        <TweakSection label="Motion">
          <TweakSlider label="Amplitude" value={t.amplitude.toFixed(2)} min={0.05} max={1} step={0.05}
                       onChange={(v) => setTweak('amplitude', Number(v))} />
          <TweakSlider label="Frequency" value={t.frequency.toFixed(1)} min={0.5} max={10} step={0.1}
                       onChange={(v) => setTweak('frequency', Number(v))} />
          <TweakSlider label="Turbulence" value={Math.round(t.turbulence * 100)} min={0} max={100} step={1} unit="%"
                       onChange={(v) => setTweak('turbulence', v / 100)} />
          <TweakSlider label="Fray" value={Math.round(t.fray * 100)} min={0} max={100} step={1} unit="%"
                       onChange={(v) => setTweak('fray', v / 100)} />
          <TweakSlider label="Speed" value={Math.round(t.speed * 50)} min={0} max={100} step={1} unit="%"
                       onChange={(v) => setTweak('speed', v / 50)} />
        </TweakSection>

        <TweakSection label="Pulse">
          <TweakSlider label="Bulge size" value={t.pulseAmount.toFixed(1)} min={0} max={6} step={0.5} unit="px"
                       onChange={(v) => setTweak('pulseAmount', Number(v))} />
          <TweakSlider label="Lines pulsing" value={Math.round(t.pulseRatio * 100)} min={0} max={100} step={1} unit="%"
                       onChange={(v) => setTweak('pulseRatio', v / 100)} />
          <TweakSlider label="Bulge cadence" value={t.pulseSpeed.toFixed(1)} min={0.5} max={2} step={0.5}
                       onChange={(v) => setTweak('pulseSpeed', Number(v))} />
        </TweakSection>


      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script src="/header.js"></script>
</body>
</html>
