<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Crafting — Paulsen</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('pg-theme') || 'light');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/shared/tokens.css" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: var(--pg-bg);
    color: var(--pg-primary);
    font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
  }

  .page {
    max-width: 900px;
    margin: 0 auto;
    padding: 64px 32px 80px;
  }

  .page-header {
    margin-bottom: 40px;
    padding: 0 8px;
    animation: pg-up .8s cubic-bezier(.22,1,.36,1) both;
  }

  .page-header h1 {
    font-size: 48px;
    font-weight: 500;
    letter-spacing: -0.02em;
    line-height: 1.1;
  }

  .page-header p {
    margin-top: 8px;
    font-size: 18px;
    color: var(--pg-muted);
    line-height: 1.6;
    animation: pg-up .8s cubic-bezier(.22,1,.36,1) .1s both;
  }

  /* Guide */
  .craft-guide {
    background: var(--pg-surface);
    border-radius: 28px;
    padding: 24px;
    animation: pg-up .7s cubic-bezier(.22,1,.36,1) .2s both;
  }

  .craft-guide-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .craft-guide-name {
    font-size: 22px;
    font-weight: 500;
    letter-spacing: -0.01em;
  }

  .craft-guide-meta {
    margin-top: 4px;
    font-size: 14px;
    line-height: 21px;
    color: var(--pg-muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .craft-meta-sep {}

  .craft-tooltip-wrap { position: relative; display: inline-flex; align-items: center; }

  .craft-info-btn {
    width: 16px; height: 16px;
    border: none; background: none; padding: 0;
    color: var(--pg-muted); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    margin-left: 2px;
    opacity: .7; transition: opacity .15s;
  }
  .craft-info-btn:hover { opacity: 1; }

  .craft-tooltip {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    background: var(--pg-bg);
    border: .5px solid var(--pg-border);
    border-radius: 12px;
    padding: 12px 14px;
    box-shadow: 0 8px 32px rgba(0,0,0,.12);
    z-index: 50;
    width: 280px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .craft-tooltip-row { display: flex; flex-direction: column; gap: 4px; }
  .craft-tooltip-name { font-size: 12px; font-weight: 600; color: var(--pg-primary); }
  .craft-tooltip-stats { display: flex; gap: 8px; }
  .craft-tooltip-stat { display: flex; flex-direction: column; gap: 1px; background: rgba(28,25,23,.06); border-radius: 6px; padding: 4px 8px; }
  html[data-theme="dark"] .craft-tooltip-stat { background: rgba(253,253,251,.08); }
  .craft-tooltip-stat-label { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--pg-muted); }
  .craft-tooltip-stat-value { font-size: 12px; font-weight: 500; color: var(--pg-primary); font-variant-numeric: tabular-nums; }
  .craft-tooltip-desc { font-size: 12px; color: var(--pg-muted); line-height: 18px; }

  .craft-intro {
    font-size: 13px;
    color: var(--pg-muted);
    line-height: 1.6;
    margin-bottom: 20px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--pg-border);
  }

  /* Steps */
  .craft-steps { display: flex; flex-direction: column; gap: 0; }

  .craft-step {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    padding: 14px 0;
    position: relative;
  }
  .craft-step:not(:last-child)::after {
    content: '';
    position: absolute;
    bottom: 0; left: 32px; right: 0;
    height: 1px;
    background: var(--pg-border);
  }

  .craft-step-num {
    flex-shrink: 0;
    width: 16px;
    text-align: right;
    font-size: 14px;
    font-weight: 500;
    color: var(--pg-primary);
    line-height: 21px;
  }

  .craft-step-body { flex: 1; min-width: 0; }

  .craft-step-header {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 8px;
  }

  .craft-step-cost {
    font-size: 12px;
    font-weight: 400;
    color: var(--pg-muted);
    margin-left: auto;
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }

  .craft-header-items {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px;
    flex: 1;
    min-width: 0;
  }

  .craft-sep {
    font-size: 12px;
    font-weight: 400;
    color: var(--pg-primary);
  }

  .craft-chip-icon {
    width: 14px;
    height: 14px;
    object-fit: contain;
    flex-shrink: 0;
  }

  .craft-chip-wrap { position: relative; display: inline-flex; }

  .craft-currency {
    font-size: 12px;
    font-weight: 500;
    height: 20px;
    padding: 0 8px;
    border-radius: 6px;
    background: rgba(28,25,23,.08);
    color: var(--pg-primary);
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  html[data-theme="dark"] .craft-currency { background: rgba(253,253,251,.1); }

  .craft-currency--tip { cursor: default; }
  .craft-currency--tip:hover { background: rgba(28,25,23,.14); }
  html[data-theme="dark"] .craft-currency--tip:hover { background: rgba(253,253,251,.16); }

  .craft-chip-price {
    font-size: 12px;
    font-weight: 500;
    color: var(--pg-muted);
    font-variant-numeric: tabular-nums;
  }

  .craft-chip-tooltip {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    background: var(--pg-bg);
    border: .5px solid var(--pg-border);
    border-radius: 10px;
    padding: 8px 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,.12);
    z-index: 50;
    width: 260px;
    font-size: 12px;
    line-height: 18px;
    color: var(--pg-muted);
    font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
    white-space: normal;
    pointer-events: none;
  }

  .craft-trade-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    font-weight: 500;
    height: 20px;
    padding: 0 8px;
    border-radius: 6px;
    background: rgba(28,25,23,.08);
    color: var(--pg-primary);
    text-decoration: none;
    white-space: nowrap;
    transition: color .15s, background .15s;
  }
  .craft-trade-link:hover { background: rgba(28,25,23,.14); }
  html[data-theme="dark"] .craft-trade-link { background: rgba(253,253,251,.1); }
  html[data-theme="dark"] .craft-trade-link:hover { background: rgba(253,253,251,.16); color: var(--pg-primary); }

  .craft-goal {
    font-size: 13px;
    color: var(--pg-primary);
    line-height: 20px;
  }

  .craft-note {
    margin-top: 2px;
    font-size: 12px;
    color: var(--pg-muted);
    line-height: 18px;
  }

  @keyframes pg-up {
    from { opacity: 0; translate: 0 16px; }
    to   { opacity: 1; translate: 0 0; }
  }

  @media (min-width: 640px) and (max-width: 1024px) {
    .page { padding: 48px 24px 80px; }
    .page-header { margin-bottom: 32px; }
    .page-header h1 { font-size: 40px; }
    .page-header p { font-size: 16px; }
  }

  @media (max-width: 639px) {
    .page { padding: 40px 16px 64px; }
    .page-header { margin-bottom: 24px; }
    .page-header h1 { font-size: 32px; }
    .page-header p { font-size: 14px; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="page-header">
    <h1>Crafting</h1>
    <p>Step-by-step crafting guides for PoE2.</p>
  </div>
  <div id="root"></div>
</div>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script src="app.js"></script>
<script src="/header.js"></script>
</body>
</html>
