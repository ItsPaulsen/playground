<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Waystones — Paulsen</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap"></noscript>
<link rel="stylesheet" href="/shared/tokens.css" />
<link rel="stylesheet" href="/shared/components.css" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow-y: auto;
    background: var(--pg-bg);
    color: var(--pg-primary);
    font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
  }

  .page {
    max-width: 640px;
    margin: 0 auto;
    padding: 64px 32px;
  }

  .page-header {
    margin-bottom: 40px;
    padding: 0 8px;
  }

  .page-header h1 {
    font-size: 48px;
    font-weight: 500;
    letter-spacing: -0.02em;
    line-height: 1.1;
    animation: pg-up .8s cubic-bezier(.22,1,.36,1) both;
  }

  .page-header p {
    margin-top: 8px;
    font-size: 18px;
    color: var(--pg-muted);
    line-height: 1.6;
    animation: pg-up .8s cubic-bezier(.22,1,.36,1) .1s both;
  }

  /* Combined box — floating bottom bar (sticky: centers with content, never over the scrollbar) */
  .poe-combined {
    position: sticky;
    bottom: 24px;
    width: 100%;
    margin-top: 24px;
    background: rgba(255,255,255,0.6);
    backdrop-filter: blur(10px);
    border: none;
    border-radius: var(--radius-sm);
    corner-shape: superellipse(1.7);
    box-shadow: rgba(0,0,0,0.05) 0px 6px 24px 0px, rgba(0,0,0,0.06) 0px 0px 0px 1px;
    padding: 12px 16px 12px 20px;
    z-index: 100;
    animation: pg-up .7s cubic-bezier(.22,1,.36,1) .15s both;
  }
  .poe-combined.over { border-color: #ef4444; }

  .poe-combined-hd {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .poe-combined-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--pg-muted);
  }

  .poe-combined-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

  .poe-trade-btn {
    display: flex;
    align-items: center;
    gap: 4px;
    height: 32px;
    padding: 0 12px;
    border-radius: 12px;
    border: none;
    background: var(--pg-bg);
    color: var(--pg-primary);
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background .15s;
  }
  .poe-trade-btn { background: rgba(28,25,23,.15); color: inherit; }
  .poe-trade-btn:not(:disabled) { background: var(--pg-border); }
  .poe-trade-btn:not(:disabled):hover { background: var(--pg-border); filter: brightness(.95); }
  .poe-trade-btn:disabled { opacity: .35; cursor: default; pointer-events: none; }
  html[data-theme="dark"] .poe-trade-btn { background: rgba(253,253,251,.15); }
  html[data-theme="dark"] .poe-trade-btn:disabled { opacity: .25; }

  @keyframes poe-spin { to { transform: rotate(360deg); } }
  .poe-spin { animation: poe-spin .8s linear infinite; }

  .poe-char-count {
    font-size: 11px;
    color: var(--pg-muted);
    font-variant-numeric: tabular-nums;
  }
  .poe-char-count.over { color: #ef4444; }

  .poe-copy-btn {
    display: flex;
    align-items: center;
    gap: 4px;
    height: 32px;
    padding: 0 12px;
    border-radius: 12px;
    border: none;
    background: rgba(28,25,23,.15);
    color: inherit;
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background .15s;
  }
  .poe-copy-btn:not(:disabled) { background: #4f46e5; color: #fff; }
  .poe-copy-btn:not(:disabled):hover { background: #4338ca; }
  html[data-theme="dark"] .poe-copy-btn:disabled { background: rgba(253,253,251,.15); }
  .poe-copy-btn:disabled { opacity: .35; cursor: default; pointer-events: none; }
  html[data-theme="dark"] .poe-copy-btn:disabled { opacity: .25; }

  .poe-combined-val {
    font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
    font-size: 13px;
    color: var(--pg-primary);
    min-width: 0;
    flex: 1;
    padding-right: 8px;
    display: flex;
    align-items: center;
  }
  .poe-combined-text {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }

  .poe-combined-placeholder { color: var(--pg-muted); font-family: inherit; }

  .poe-reset-btn {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    border: none;
    border-radius: 50%;
    background: rgba(28,25,23,.12);
    color: var(--pg-muted);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    margin-right: 8px;
    vertical-align: middle;
    transition: background .15s, color .15s;
  }
  .poe-reset-btn:hover { background: rgba(28,25,23,.2); color: var(--pg-primary); }
  html[data-theme="dark"] .poe-reset-btn { background: rgba(253,253,251,.12); }
  html[data-theme="dark"] .poe-reset-btn:hover { background: rgba(253,253,251,.2); }
  .poe-combined-val { font-weight: 400; }
  .poe-combined-val strong { font-weight: 500; }

  /* Panel */
  .poe-panel {
    background: var(--pg-surface);
    border-radius: var(--radius-md);
    corner-shape: superellipse(1.7);
    padding: 16px 24px;
    animation: pg-up .7s cubic-bezier(.22,1,.36,1) .22s both;
    overflow: hidden;
  }

  .poe-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0;
    height: 48px;
    position: relative;
    cursor: pointer;
  }
  .poe-row:not(.last)::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 30px;
    right: 0;
    height: 1px;
    background: var(--pg-border);
  }

  .poe-toggle {
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    border: none;
    background: none;
    padding: 0;
    cursor: pointer;
    color: var(--pg-primary);
    opacity: .15;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color .15s;
  }
  .poe-row.active .poe-toggle { color: var(--pg-primary); opacity: 1; }
  .poe-row:not(.active):hover .poe-toggle { opacity: .4; }

  .poe-label {
    flex: 1;
    font-size: 13px;
    font-weight: 500;
    color: var(--pg-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: color .15s;
  }
  .poe-row.active .poe-label { color: var(--pg-primary); }

  .poe-row:not(.active) .pg-bar { opacity: .4; transition: opacity .15s; }

  /* Bar slider */
  .pg-bar { width: 140px; }

  /* Hint */
  .poe-hint {
    margin-top: 8px;
    padding: 12px 16px;
    background: var(--pg-surface);
    border-radius: 14px;
    corner-shape: superellipse(1.7);
    font-size: 12px;
    color: var(--pg-muted);
    line-height: 1.6;
    animation: pg-up .7s cubic-bezier(.22,1,.36,1) .3s both;
  }
  .poe-hint strong { color: var(--pg-primary); }

  code {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    background: var(--pg-border);
    border-radius: 4px;
    padding: 1px 5px;
    font-size: .85em;
  }

  /* Toast */
  .poe-toast {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(-6px);
    background: var(--pg-surface);
    border: 1px solid var(--pg-border);
    border-radius: 12px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--pg-primary);
    opacity: 0;
    transition: opacity .2s, transform .2s;
    pointer-events: none;
    z-index: 500;
    white-space: nowrap;
    box-shadow: 0 8px 40px rgba(0,0,0,.12);
    max-width: calc(100vw - 48px);
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .poe-toast.is-visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }


  @keyframes pg-up {
    from { opacity: 0; translate: 0 16px; }
    to   { opacity: 1; translate: 0 0; }
  }

  html[data-theme="dark"] .poe-combined {
    background: rgba(41,37,36,0.6);
    box-shadow: rgba(0,0,0,0.2) 0px 6px 24px 0px, rgba(255,255,255,0.1) 0px 0px 0px 1px;
  }

  .poe-demand-warning {
    margin-top: 12px;
    font-size: 12px;
    line-height: 14px;
    color: #dc2626;
    padding: 0 16px;
    display: flex;
    align-items: flex-start;
    gap: 5px;
  }
  html[data-theme="dark"] .poe-demand-warning { color: #ef4444; }
  .poe-demand-warning svg { flex-shrink: 0; margin-top: 0; }

  @media (640px <= width < 1024px) {
    .page { padding: 48px 24px 64px; }
    .page-header { margin-bottom: 32px; }
    .page-header h1 { font-size: 40px; }
    .page-header p { font-size: 16px; }
  }

  @media (width < 640px) {
    .page { padding: 40px 16px 48px; }
    .page-header { margin-bottom: 24px; }
    .page-header h1 { font-size: 32px; }
    .page-header p { font-size: 14px; }
    .pg-bar { width: 110px; }
    .poe-combined { bottom: max(16px, env(safe-area-inset-bottom)); padding: 10px 16px; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="page-header">
    <h1>Waystones</h1>
    <p>Copy-ready search strings for PoE2 Waystones.</p>
  </div>
  <div id="root"></div>
</div>
<script src="/shared/vendor/preact-bundle.js"></script>

<script src="app.js"></script>
<script src="/header.js"></script>
</body>
</html>
