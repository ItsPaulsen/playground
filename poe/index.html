<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Path of Exile — Paulsen</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">

<link rel="manifest" href="/site.webmanifest">
<link rel="prefetch" href="/waystones/">
<link rel="prefetch" href="/crafting/">
  <script>(function(){var t=localStorage.getItem('pg-theme')||'light';document.documentElement.setAttribute('data-theme',t);var m=document.createElement('meta');m.name='theme-color';m.content=t==='dark'?'oklch(21.6% 0.006 56.043)':'oklch(98.5% 0.001 106.423)';document.head.appendChild(m);})()</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap"></noscript>
  <style>
:root{--pg-light-100:oklch(98.5% 0.001 106.423);--pg-light-200:oklch(97% 0.001 106.424);--pg-light-300:oklch(92.3% 0.003 48.717);--pg-light-400:oklch(55.3% 0.013 58.071);--pg-light-500:oklch(21.6% 0.006 56.043);--pg-dark-100:oklch(21.6% 0.006 56.043);--pg-dark-200:oklch(26.8% 0.007 34.298);--pg-dark-300:oklch(37.4% 0.01 67.558);--pg-dark-400:oklch(86.9% 0.005 56.366);--pg-dark-500:oklch(98.5% 0.001 106.423);--pg-bg:var(--pg-light-100);--pg-surface:var(--pg-light-200);--pg-border:var(--pg-light-300);--pg-muted:var(--pg-light-400);--pg-primary:var(--pg-light-500)}html[data-theme="dark"]{--pg-bg:var(--pg-dark-100);--pg-surface:var(--pg-dark-200);--pg-border:var(--pg-dark-300);--pg-muted:var(--pg-dark-400);--pg-primary:var(--pg-dark-500)}:focus-visible{outline:2px solid var(--pg-primary);outline-offset:2px;border-radius:4px}
</style>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--pg-bg);
      color: var(--pg-primary);
      font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
    }

    .page {
      padding: 64px max(32px, calc((100vw - 1140px) / 2));
    }

    .page-header {
      margin-bottom: 40px;
      position: relative;
      padding: 0 8px;
    }

    .page-header h1 {
      font-size: 48px;
      font-weight: 500;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .page-header p {
      margin-top: 8px;
      font-size: 18px;
      color: var(--pg-muted);
      line-height: 1.6;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .card h2 {
      font-size: 24px;
      font-weight: 500;
      color: var(--pg-primary);
      margin-bottom: 6px;
      line-height: 1.2;
    }

    .card p {
      font-size: 16px;
      color: var(--pg-muted);
      line-height: 1.5;
    }

    @media (min-width: 640px) and (max-width: 1024px) {
      .page { padding: 48px max(24px, calc((100vw - 1140px) / 2)) 64px; }
      .page-header { margin-bottom: 32px; }
      .page-header h1 { font-size: 40px; }
      .page-header p { font-size: 16px; }
      .card h2 { font-size: 22px; }
      .card p { font-size: 14px; }
      .grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 639px) {
      .page { padding: 40px 16px 48px; }
      .page-header { margin-bottom: 24px; }
      .page-header h1 { font-size: 32px; }
      .page-header p { font-size: 14px; }
      .card h2 { font-size: 20px; }
      .card p { font-size: 14px; }
      .grid { grid-template-columns: 1fr; }
    }

    .card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: var(--pg-surface);
      border-radius: 28px;
      padding: 28px;
      transition: transform .4s cubic-bezier(.25,.46,.45,.94),
                  box-shadow .4s cubic-bezier(.25,.46,.45,.94);
    }

    @media (hover: hover) {
      .card:hover { transform: scale(1.02); }
    }
    .card:active { transform: scale(0.97); opacity: 0.7; transition-duration: .08s; }

    .card-icon {
      width: 40px;
      height: 40px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    .card-icon--indigo { background: rgba(191,219,254,.7); color: #1e40af; }
    html[data-theme="dark"] .card-icon--indigo { background: #1e3a8a; color: #93c5fd; }
    .card-icon--green { background: rgba(187,247,208,.7); color: #166534; }
    html[data-theme="dark"] .card-icon--green { background: #14532d; color: #86efac; }

    @keyframes pg-up {
      from { opacity: 0; translate: 0 24px; }
      to   { opacity: 1; translate: 0 0; }
    }
    .page-header h1 { animation: pg-up .8s cubic-bezier(.22,1,.36,1) both; }
    .page-header p  { animation: pg-up .8s cubic-bezier(.22,1,.36,1) .12s both; }
    .card           { animation: pg-up .7s cubic-bezier(.22,1,.36,1) both; }
    .card:nth-child(1) { animation-delay: .2s; }
    .card:nth-child(2) { animation-delay: .3s; }

    .style-link {
      font-size: 12px;
      color: var(--pg-muted);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      height: 36px;
    }
    @media (max-width: 639px) {
      .style-link { display: none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="page-header">
      <h1>Path of Exile</h1>
      <p>Tools that might be useful</p>
    </div>

    <div class="grid" id="main-content">
      <a class="card" href="/waystones/">
        <div class="card-icon card-icon--green">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="4.5" r="2.5"/><path d="m10.2 6.3-3.9 3.9"/><circle cx="4.5" cy="12" r="2.5"/><path d="M7 12h10"/><circle cx="19.5" cy="12" r="2.5"/><path d="m13.8 17.7 3.9-3.9"/><circle cx="12" cy="19.5" r="2.5"/>
          </svg>
        </div>
        <h2>Waystones</h2>
        <p>Copy-ready search strings for PoE2 Waystones.</p>
      </a>

      <a class="card" href="/crafting/">
        <div class="card-icon card-icon--indigo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
          </svg>
        </div>
        <h2>Crafting</h2>
        <p>Step-by-step crafting guides for PoE2.</p>
      </a>
    </div>
  </div>


  <script src="/header.js"></script>
</body>
</html>
