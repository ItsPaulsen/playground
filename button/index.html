<!doctype html>
<html lang="en" data-page="agent">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Button — Paulsen</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<script>(function(){var t=localStorage.getItem('pg-theme')||'light';document.documentElement.setAttribute('data-theme',t);var m=document.createElement('meta');m.name='theme-color';m.content='oklch(0.09 0.025 265)';document.head.appendChild(m);})()</script>
<link rel="preload" href="/shared/vendor/preact-bundle.js" as="script">
<link rel="preload" href="../shared/tweaks-panel.js" as="script">
<link rel="preload" href="app.js" as="script">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap"></noscript>
<link rel="stylesheet" href="/shared/tokens.css" />
<link rel="stylesheet" href="/shared/components.css" />
<link rel="stylesheet" href="/shared/tweaks-panel.css" data-twk-css="1" />
<style>
  html, body {
    margin: 0; padding: 0; height: 100dvh; overflow: hidden;
    font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
    background: var(--pg-bg);
  }
  #root { height: 100%; }

  .stage {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 48px;
  }

  /* Dot-grid backdrop */
  .stage::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background-image: radial-gradient(circle, oklch(0.87 0.006 56) 1px, transparent 1px);
    background-size: 36px 36px;
  }
  html[data-theme="dark"] .stage::before {
    background-image: radial-gradient(circle, var(--pg-border) 1px, transparent 1px);
  }

  /* ── Button outer wrapper — animation lives here ── */
  .btn-svg-wrap {
    position: relative;
    z-index: 1;
  }

  /* The actual button */
  .agent-btn {
    position: relative; z-index: 1;
    padding: 16px 32px;
    background: #fff;
    color: var(--pg-primary);
    border: none; border-radius: 9999px; outline: none;
    font-family: inherit; font-size: 22px; font-weight: 500; line-height: 28px;
    letter-spacing: .05em;
    cursor: pointer;
    overflow: clip;
    transition: none;
    box-shadow: none;
  }
  html[data-theme="dark"] .agent-btn {
    background: #0c0a09;
  }

  :root { --btn-ring: rgba(0, 0, 0, 0.08); }
  html[data-theme="dark"] { --btn-ring: rgba(255, 255, 255, 0.08); }

  .agent-btn:focus-visible { outline: 2px solid var(--spark, #818cf8); outline-offset: 6px; }

</style>
</head>
<body>
<div id="root" tabindex="-1"></div>
<script src="/shared/vendor/preact-bundle.js"></script>
<script src="../shared/tweaks-panel.js"></script>
<script src="app.js"></script>
<script src="/header.js"></script>
</body>
</html>
