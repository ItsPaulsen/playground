<link rel="stylesheet" href="/shared/tokens.css" />
  <link rel="stylesheet" href="/shared/components.css" />
<style>
  html, body { margin: 0; padding: 0; height: 100dvh; background: var(--pg-bg); overflow: hidden;
    font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }
  #root { position: fixed; top: env(safe-area-inset-top,0px); left: 0; right: 0; bottom: env(safe-area-inset-bottom,0px); }
:root {
    --nav-bg: rgba(255,255,255,0.6);
    --nav-filter: blur(10px);
    --nav-bg-open: var(--pg-surface);
  }
  html[data-theme="dark"] {
    --nav-bg: rgba(41,37,36,0.6);
  }

  @keyframes mesh-orbit {
    from { transform: rotate(0turn); }
    to   { transform: rotate(1turn); }
  }

</style>
</head>
<body>
<div id="root" tabindex="-1"></div>
<div id="mesh-boot"></div>
<script>
(function(){
  var dark=document.documentElement.getAttribute('data-theme')==='dark';
  var palettes=[
    {light:['#f87171','#38bdf8'],dark:['#dc2626','#0284c7']},
    {light:['#fb923c','#a78bfa'],dark:['#ea580c','#7c3aed']},
    {light:['#fbbf24','#2dd4bf'],dark:['#d97706','#0d9488']},
    {light:['#22d3ee','#c084fc'],dark:['#0891b2','#9333ea']},
  ];
  var c=palettes[0][dark?'dark':'light'];
  var boot=document.getElementById('mesh-boot');
  boot.style.cssText='position:fixed;inset:0;pointer-events:none;transition:opacity .15s;background:radial-gradient(ellipse at 65% 40%,'+c[0]+' 0%,transparent 55%),radial-gradient(ellipse at 35% 60%,'+c[1]+' 0%,transparent 55%)';
  new MutationObserver(function(_,obs){
    if(document.getElementById('root').firstChild){
      obs.disconnect();
      setTimeout(function(){
        boot.style.opacity='0';
        setTimeout(function(){boot.remove();},150);
      },50);
    }
  }).observe(document.getElementById('root'),{childList:true});
})();
</script>
<script src="/shared/vendor/preact-bundle.js"></script>

<script src="../shared/tweaks-panel.js"></script>
<script src="mesh.js"></script>
<script src="app.js"></script>
