<!doctype html>
<html lang="en" data-page="mesh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mesh — Paulsen</title>
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('pg-theme') || 'light');</script>
<link rel="stylesheet" href="/shared/tokens.css" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: var(--pg-bg); overflow: hidden;
    font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }
  #root { position: fixed; inset: 0; }

  @keyframes mesh-orbit {
    0%   { transform: rotate(0turn)  scale(1.00); }
    50%  { transform: rotate(.5turn) scale(0.75); }
    100% { transform: rotate(1turn)  scale(1.00); }
  }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script src="../shared/tweaks-panel.js"></script>
<script src="mesh.js"></script>
</head>
<body>
<div id="root"></div>
<script src="app.js"></script>
<script src="/header.js"></script>
<style>
  #site-nav { background: color-mix(in srgb, var(--pg-surface) 80%, transparent); backdrop-filter: blur(12px) saturate(180%); }
  #site-menu { background: color-mix(in srgb, var(--pg-surface) 80%, transparent); backdrop-filter: blur(12px) saturate(180%); }
  #site-menu.is-open { background: var(--pg-surface); backdrop-filter: none; }
</style>
</body>
</html>
