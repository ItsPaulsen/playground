<!doctype html>
<html lang="en" data-page="mesh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Mesh — Paulsen</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('pg-theme') || 'light');</script>
<link rel="preload" href="/shared/vendor/preact-bundle.js" as="script">
<link rel="preload" href="../shared/tweaks-panel.js" as="script">
<link rel="preload" href="mesh.js" as="script">
<link rel="preload" href="app.js" as="script">


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap"></noscript>
<style>
:root{--pg-light-100:#fdfdfb;--pg-light-200:#f4f4f3;--pg-light-300:#e7e5e4;--pg-light-400:#68625d;--pg-light-500:#1c1917;--pg-dark-100:#1c1917;--pg-dark-200:#292524;--pg-dark-300:#44403c;--pg-dark-400:#d6d3d1;--pg-dark-500:#fafaf9;--pg-bg:var(--pg-light-100);--pg-surface:var(--pg-light-200);--pg-border:var(--pg-light-300);--pg-muted:var(--pg-light-400);--pg-primary:var(--pg-light-500)}html[data-theme="dark"]{--pg-bg:var(--pg-dark-100);--pg-surface:var(--pg-dark-200);--pg-border:var(--pg-dark-300);--pg-muted:var(--pg-dark-400);--pg-primary:var(--pg-dark-500)}:focus-visible{outline:2px solid var(--pg-primary);outline-offset:2px;border-radius:4px}
</style>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: var(--pg-bg); overflow: hidden;
    font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }
  #root { position: fixed; inset: 0; }
  :root {
    --nav-bg: color-mix(in srgb, var(--pg-surface) 80%, transparent);
    --nav-filter: blur(12px) saturate(180%);
    --nav-bg-open: var(--pg-surface);
  }

  @keyframes mesh-orbit {
    0%   { transform: rotate(0turn)  scale(1.00); }
    50%  { transform: rotate(.5turn) scale(0.75); }
    100% { transform: rotate(1turn)  scale(1.00); }
  }
</style>
</head>
<body>
<div id="root" tabindex="-1"></div>
<div id="mesh-boot"></div>
<script>
(function(){
  var dark=document.documentElement.getAttribute('data-theme')==='dark';
  var palettes=[
    {light:['#f87171','#38bdf8'],dark:['#dc2626','#0284c7']},
    {light:['#fb923c','#a78bfa'],dark:['#ea580c','#7c3aed']},
    {light:['#fbbf24','#2dd4bf'],dark:['#d97706','#0d9488']},
    {light:['#22d3ee','#c084fc'],dark:['#0891b2','#9333ea']},
  ];
  var c=palettes[0][dark?'dark':'light'];
  var boot=document.getElementById('mesh-boot');
  boot.style.cssText='position:fixed;inset:0;pointer-events:none;transition:opacity .15s;background:radial-gradient(ellipse at 65% 40%,'+c[0]+' 0%,transparent 55%),radial-gradient(ellipse at 35% 60%,'+c[1]+' 0%,transparent 55%)';
  new MutationObserver(function(_,obs){
    if(document.getElementById('root').firstChild){
      obs.disconnect();
      setTimeout(function(){
        boot.style.opacity='0';
        setTimeout(function(){boot.remove();},150);
      },50);
    }
  }).observe(document.getElementById('root'),{childList:true});
})();
</script>
<script src="/shared/vendor/preact-bundle.js"></script>

<script src="../shared/tweaks-panel.js"></script>
<script src="mesh.js"></script>
<script src="app.js"></script>
<script src="/header.js"></script>
</body>
</html>
