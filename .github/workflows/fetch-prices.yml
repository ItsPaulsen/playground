name: Fetch PoE2 Prices

on:
  schedule:
    - cron: '0 * * * *'   # every hour
  workflow_dispatch:        # allow manual trigger

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch prices from poe.ninja
        run: |
          python3 << 'EOF'
          import urllib.request, json, os

          LEAGUE = 'Runes of Aldur'
          BASE = 'https://poe.ninja/poe2/api/economy/exchange/current/overview'
          TYPES = ['Currency', 'Essences', 'Ritual', 'Abyss']

          headers = {'User-Agent': 'Mozilla/5.0'}
          prices = {}

          for t in TYPES:
              url = f'{BASE}?league={urllib.parse.quote(LEAGUE)}&type={t}'
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=10) as r:
                      data = json.loads(r.read())
                  item_by_id = {i['id']: i for i in data.get('items', [])}
                  for line in data.get('lines', []):
                      item = item_by_id.get(line['id'])
                      if item and line.get('primaryValue') is not None:
                          entry = {'price': line['primaryValue']}
                          if item.get('image'):
                              entry['icon'] = 'https://web.poecdn.com' + item['image']
                          prices[item['name']] = entry
              except Exception as e:
                  print(f'Failed {t}: {e}')

          import urllib.parse
          os.makedirs('crafting', exist_ok=True)
          with open('crafting/prices.json', 'w') as f:
              json.dump(prices, f)
          print(f'Wrote {len(prices)} prices')
          EOF

      - name: Commit prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add crafting/prices.json
          git diff --cached --quiet || git commit -m "Update PoE2 prices"
          git push
