name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # First attempt — the Pages publish API flakes intermittently
      # ("Deployment failed, try again later"), so don't fail the job on it.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      # Wait out the transient, then retry once. If this also fails, the job fails for real.
      - if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
