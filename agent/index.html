<style>
  @property --angle {
    syntax: '<angle>';
    initial-value: 0deg;
    inherits: true;
  }

  @keyframes spin { to { --angle: 360deg; } }

  /* Dark theme (default) */
  :root {
    --stage-bg:     oklch(0.09 0.025 265);
    --btn-bg-a:     oklch(0.17 0.04 265);
    --btn-bg-b:     oklch(0.12 0.025 265);
    --btn-color:    oklch(0.93 0.015 265);
    --btn-overlay:  rgba(255,255,255,.4);
    --spark-peak:   #ffffff;
    --dot-color:    rgba(129,140,248,.08);
  }
  /* Light theme */
  html:not([data-theme="dark"]) {
    --stage-bg:     oklch(0.96 0.01 265);
    --btn-bg-a:     oklch(0.99 0.006 265);
    --btn-bg-b:     oklch(0.94 0.02 265);
    --btn-color:    oklch(0.2 0.05 265);
    --btn-overlay:  rgba(0,0,0,.4);
    --spark-peak:   color-mix(in oklch, var(--spark, #818cf8) 40%, white);
    --dot-color:    rgba(99,102,241,.1);
  }

  html, body {
    margin: 0; padding: 0; height: 100dvh; overflow: hidden;
    font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
    background: var(--stage-bg);
  }
  #root { height: 100%; }

  #site-nav {
    background: color-mix(in oklch, var(--stage-bg) 85%, transparent);
    backdrop-filter: blur(20px) saturate(180%);
  }

  .stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Dot-grid backdrop */
  .stage::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background-image: radial-gradient(circle, var(--dot-color) 1px, transparent 1px);
    background-size: 36px 36px;
  }

  /* ── Button outer wrapper — animation lives here ── */
  .btn-outer {
    position: relative;
    display: inline-flex;
    border-radius: 22px;
    animation: spin var(--dur, 2.5s) linear infinite;
    z-index: 1;
  }

  /* Glow — masked to just the border ring so it doesn't bleed behind the button */
  .btn-outer::after {
    content: ''; position: absolute; inset: -3px; border-radius: 25px;
    padding: calc(var(--thick, 2px) + 9px);
    pointer-events: none;
    background: conic-gradient(from var(--angle),
      transparent 0%, transparent 70%,
      var(--spark, #818cf8) 83%, var(--spark-peak, #fff) 93%, var(--spark, #818cf8) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    filter: blur(8px);
    opacity: var(--glow-op, .7);
    transition: opacity .4s, filter .4s;
  }

  /* Border shell — overflow:hidden clips the inner gradient to just the padding strip */
  .btn-shell {
    position: relative; z-index: 1;
    display: inline-flex;
    border-radius: 22px;
    padding: var(--thick, 2px);
    overflow: hidden;
  }

  /* Spinning gradient — large square so it covers the element at all angles */
  .btn-shell::before {
    content: ''; position: absolute; pointer-events: none;
    width: 400%; aspect-ratio: 1;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: conic-gradient(from var(--angle),
      transparent 0%, transparent 70%,
      var(--spark, #818cf8) 83%, var(--spark-peak, #fff) 93%, var(--spark, #818cf8) 100%);
  }

  /* The actual button */
  .agent-btn {
    position: relative; z-index: 1;
    padding: 22px 56px;
    background: linear-gradient(160deg, var(--btn-bg-a), var(--btn-bg-b));
    color: var(--btn-color);
    border: none; border-radius: 20px; outline: none;
    font-family: inherit; font-size: 20px; font-weight: 600;
    letter-spacing: .07em; text-transform: uppercase;
    cursor: pointer;
    transition: none;
  }

  /* Hover/active overlay */
  .agent-btn::after {
    content: ''; position: absolute; inset: 0; border-radius: inherit;
    background: var(--btn-overlay, rgba(255,255,255,.4));
    opacity: 0; pointer-events: none;
    transition: opacity .15s;
  }

  .agent-btn:hover::after { opacity: 1; }
  .agent-btn:active::after { opacity: 1; }
  .agent-btn:focus-visible { outline: 2px solid var(--spark, #818cf8); outline-offset: 6px; }

  /* Hover: 3× faster spin + brighter glow */
  .btn-outer:hover { animation-duration: calc(var(--dur, 2.5s) / 3); }
  .btn-outer:hover::after {
    opacity: min(calc(var(--glow-op, .7) * 1.4), .95);
    filter: blur(12px);
  }

  /* Hover-only mode */
  .btn-outer.hover-only { animation: none; }
  .btn-outer.hover-only .btn-shell::before { opacity: 0; }
  .btn-outer.hover-only::after { opacity: 0 !important; transition: none; }
  .btn-outer.hover-only:hover { animation: spin calc(var(--dur, 2.5s) / 1.5) linear infinite; }
  .btn-outer.hover-only:hover .btn-shell::before { opacity: 1; }
  .btn-outer.hover-only:hover::after { opacity: var(--glow-op, .7) !important; transition: opacity .35s; }
</style>
</head>
<body>
<div id="root" tabindex="-1"></div>
<script src="/shared/vendor/preact-bundle.js"></script>
<script src="../shared/tweaks-panel.js"></script>
