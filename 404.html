<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <script>(function(){var t=localStorage.getItem('pg-theme')||'light';document.documentElement.setAttribute('data-theme',t);var m=document.createElement('meta');m.name='theme-color';m.content=t==='dark'?'oklch(0.22 0.01 56)':'oklch(0.98 0.00 106)';document.head.appendChild(m);})()</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap"></noscript>
  <link rel="stylesheet" href="/shared/tokens.css" />
  <link rel="stylesheet" href="/shared/components.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      background: var(--pg-bg);
      color: var(--pg-primary);
      font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
    }

    .content {
      position: fixed;
      inset: 0;
      top: var(--header-h, 48px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      padding: 32px;
      text-align: center;
    }

    .content img {
      max-width: 320px;
      width: 100%;
      border-radius: 12px;
      display: block;
    }

    .content hr {
      width: 100%;
      max-width: 320px;
      border: none;
      border-top: 1px solid rgba(0,0,0,.12);
      margin: 0 0 32px;
    }

    .content h2 {
      font-size: 24px;
      font-weight: 500;
      line-height: 1.2;
    }

    @media (max-width: 639px) {
      .content img { max-width: 240px; }
      .content hr  { max-width: 240px; }
    }
  </style>
</head>
<body>
  <div class="content">
    <img src="/404.gif" alt="404" />
    <hr />
    <h2>Looks like you're lost.</h2>
  </div>
  <script src="/header.js"></script>
</body>
</html>
