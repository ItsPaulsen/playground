<!doctype html>
<html lang="en" data-page="wave">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Typo — Paulsen</title>
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('pg-theme') === 'dark' ? 'dark' : 'light');</script>
<link rel="stylesheet" href="/shared/tokens.css" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: var(--pg-bg); overflow: hidden;
    font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }
  #root, .stage { position: fixed; inset: 0; }
  .stage { display: block; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="../shared/tweaks-panel.jsx"></script>
<script type="text/babel" src="typo.jsx"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const _seg = new Intl.Segmenter();

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "text": "Catch 🤽",
  "fontSize": 128,
  "fontWeight": 600,
  "letterSpacing": 4,
  "fontColor": "#a855f7",
  "fontStyle": "normal",
  "fontEffect": "flat",
  "amplitude": 32,
  "speed": 0.49,
  "spread": 0.32
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [panelOpen, setPanelOpen] = React.useState(true);

  const rand = (min, max, step = 1) => {
    const v = Math.random() * (max - min) + min;
    return Math.round(v / step) * step;
  };
  const randomize = () => setTweak({
    fontSize:      rand(32, 160, 4),
    fontWeight:    rand(300, 700, 100),
    letterSpacing: rand(0, 32, 1),
    amplitude:     rand(4, 60, 2),
    speed:         rand(0.25, 1, 0.05),
    spread:        rand(0, 1, 0.01),
  });

  return (
    <>
      <Typo t={t} panelOpen={panelOpen} />

      <TweaksPanel title="Typo" onOpenChange={setPanelOpen}>
        <TweakSection>
          <div style={{ position: 'relative' }}>
            <input
              className="twk-field"
              type="text"
              value={t.text}
              placeholder="Type something…"
              style={{ paddingRight: 36 }}
              onChange={(e) => { const v = [..._seg.segment(e.target.value)].slice(0, 20).map(s => s.segment).join(''); setTweak('text', v); }}
            />
            <span style={{ position: 'absolute', right: 8, top: '50%', transform: 'translateY(-50%)',
              fontSize: 10, color: 'var(--muted)', pointerEvents: 'none' }}>
              {[..._seg.segment(t.text || '')].length}/20
            </span>
          </div>
          <TweakColor
            value={t.fontColor}
            onChange={(v) => setTweak('fontColor', v)}
          />
          <TweakRadio
            value={t.fontEffect}
            options={[
              { value: 'flat',    label: 'Flat'    },
              { value: 'outline', label: 'Outline' },
            ]}
            onChange={(v) => setTweak('fontEffect', v)}
          />
        </TweakSection>

        <TweakSection label="Typography">
          <TweakSlider label="Size"    value={t.fontSize}      min={24}  max={200} step={2}   unit="px"
                       onChange={(v) => setTweak('fontSize', v)} />
          <TweakSlider label="Weight"  value={t.fontWeight}    min={300} max={700} step={100}
                       onChange={(v) => setTweak('fontWeight', v)} />
          <TweakSlider label="Spacing" value={t.letterSpacing} min={-4}  max={16}  step={1}   unit="px"
                       onChange={(v) => setTweak('letterSpacing', v)} />
        </TweakSection>

        <TweakSection label="Animation">
          <TweakSlider label="Amplitude" value={t.amplitude}         min={8}   max={48}  step={2}   unit="px"
                       onChange={(v) => setTweak('amplitude', v)} />
          <TweakSlider label="Speed"     value={Math.round((t.speed - 0.25) / 0.5 * 100)} min={10} max={100} step={1} unit="%"
                       onChange={(v) => setTweak('speed', v / 100 * 0.5 + 0.25)} />
          <TweakSlider label="Wave"      value={Math.round(t.spread * 100)} min={0} max={100} step={1} unit="%"
                       onChange={(v) => setTweak('spread', v / 100)} />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script src="/header.js"></script>
</body>
</html>
