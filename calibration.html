<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Capture calibration</title>
  <style>
    body { margin: 0; background: #808080; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; font-family: system-ui; }
    .frame { padding: 24px; background: #ff00ff; }
    img { display: block; width: 512px; height: 512px; image-rendering: pixelated; }
    p { color: #222; font-size: 14px; max-width: 560px; text-align: center; }
  </style>
</head>
<body>
  <div class="frame"><img src="calib_identity.png" alt=""></div>
  <p>Record ~2 seconds of this with cmd+shift+5 exactly like a thumb recording.
     Include the full magenta border in the selection, margins are fine.
     Save as <b>calib.mov</b> in the playground folder.</p>
</body>
</html>
