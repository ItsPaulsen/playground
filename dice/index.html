<style>
  html, body { margin: 0; padding: 0; height: 100dvh; background: var(--pg-bg); overflow: hidden;
    font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; color: var(--pg-primary); }
  #root, .stage { position: fixed; top: env(safe-area-inset-top,0px); left: 0; right: 0; bottom: env(safe-area-inset-bottom,0px); }
  .stage { display: flex; flex-direction: column; align-items: center; justify-content: center;
    overflow: hidden; -webkit-user-select: none; user-select: none; }

  /* ── Dice tray ── */
  .tray {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
    gap: var(--die-gap, 20px);
    max-width: min(90vw, 620px);
    padding: 24px;
  }

  /* ── A single die: a real 3D cube ── */
  .die {
    --s: var(--die-size, 72px);
    --h: calc(var(--s) / 2);
    width: var(--s); height: var(--s);
    position: relative;
    perspective: 1200px;
    cursor: pointer;
    outline: none;
    /* Shared face texture — referenced by every face so it's declared once. */
    --face-grad: radial-gradient(120% 120% at 30% 22%, color-mix(in srgb, var(--face) 100%, #fff 26%) 0%, var(--face) 46%, color-mix(in srgb, var(--face) 100%, #000 12%) 100%);
    /* Small radius on purpose: the rounder the corner, the bigger the
       see-through notches at the cube's corners bleed the background mid-roll. */
    --face-r: calc(var(--s) * 0.04);
  }
  /* No transform transitions or hover lifts anywhere on the die: any
     compositor-driven transform animation on the cube or its ancestors makes
     Chrome sample the preserve-3d faces out of sync and visibly unfold the
     cube. The tumble is JS-driven (rAF) for the same reason, and will-change
     is deliberately absent so writes take the fully-committed path. */
  .die.rolling { cursor: default; }

  .cube {
    position: absolute; inset: 0;
    transform-style: preserve-3d;
  }

  /* Faces — the pips are baked into each face as one tiny SVG background
     layer instead of 9 pip elements per face (54 per die). One painted
     texture per face keeps the compositor layer count low; the old per-pip
     layers were what made the roll janky. */
  .face {
    position: absolute; inset: 0;
    /* Plain circular corners on purpose: superellipse corner-shape clipping on
       composited 3D-rotating layers can mis-rasterize (stray-polygon flashes),
       and at this small radius the two are indistinguishable. */
    border-radius: var(--face-r);
    background-image: var(--face-grad);
    background-size: 100% 100%;
    background-repeat: no-repeat;
    /* Top sheen + bottom shade for the dome feel, plus a hairline dark ring so
       the die's edge stays defined against a same-tone background. */
    box-shadow:
      inset 0 2px 3px rgba(255,255,255,.4),
      inset 0 -2px 5px rgba(0,0,0,.13),
      inset 0 0 0 1px rgba(0,0,0,.07);
    backface-visibility: hidden;
  }
  .face.f1 { transform: rotateY(0deg)    translateZ(var(--h));
    background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><radialGradient id='g' cx='.35' cy='.3' r='.75'><stop offset='0' stop-color='%23696766'/><stop offset='1' stop-color='%231c1917'/></radialGradient><circle cx='50' cy='50' r='8.5' fill='url(%23g)'/></svg>"), var(--face-grad); }
  .face.f2 { transform: rotateX(90deg)   translateZ(var(--h));
    background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><radialGradient id='g' cx='.35' cy='.3' r='.75'><stop offset='0' stop-color='%23696766'/><stop offset='1' stop-color='%231c1917'/></radialGradient><circle cx='26.7' cy='26.7' r='8.5' fill='url(%23g)'/><circle cx='73.3' cy='73.3' r='8.5' fill='url(%23g)'/></svg>"), var(--face-grad); }
  .face.f3 { transform: rotateY(90deg)   translateZ(var(--h));
    background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><radialGradient id='g' cx='.35' cy='.3' r='.75'><stop offset='0' stop-color='%23696766'/><stop offset='1' stop-color='%231c1917'/></radialGradient><circle cx='26.7' cy='26.7' r='8.5' fill='url(%23g)'/><circle cx='50' cy='50' r='8.5' fill='url(%23g)'/><circle cx='73.3' cy='73.3' r='8.5' fill='url(%23g)'/></svg>"), var(--face-grad); }
  .face.f4 { transform: rotateY(-90deg)  translateZ(var(--h));
    background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><radialGradient id='g' cx='.35' cy='.3' r='.75'><stop offset='0' stop-color='%23696766'/><stop offset='1' stop-color='%231c1917'/></radialGradient><circle cx='26.7' cy='26.7' r='8.5' fill='url(%23g)'/><circle cx='73.3' cy='26.7' r='8.5' fill='url(%23g)'/><circle cx='26.7' cy='73.3' r='8.5' fill='url(%23g)'/><circle cx='73.3' cy='73.3' r='8.5' fill='url(%23g)'/></svg>"), var(--face-grad); }
  .face.f5 { transform: rotateX(-90deg)  translateZ(var(--h));
    background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><radialGradient id='g' cx='.35' cy='.3' r='.75'><stop offset='0' stop-color='%23696766'/><stop offset='1' stop-color='%231c1917'/></radialGradient><circle cx='26.7' cy='26.7' r='8.5' fill='url(%23g)'/><circle cx='73.3' cy='26.7' r='8.5' fill='url(%23g)'/><circle cx='50' cy='50' r='8.5' fill='url(%23g)'/><circle cx='26.7' cy='73.3' r='8.5' fill='url(%23g)'/><circle cx='73.3' cy='73.3' r='8.5' fill='url(%23g)'/></svg>"), var(--face-grad); }
  .face.f6 { transform: rotateY(180deg)  translateZ(var(--h));
    background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><radialGradient id='g' cx='.35' cy='.3' r='.75'><stop offset='0' stop-color='%23696766'/><stop offset='1' stop-color='%231c1917'/></radialGradient><circle cx='26.7' cy='26.7' r='8.5' fill='url(%23g)'/><circle cx='26.7' cy='50' r='8.5' fill='url(%23g)'/><circle cx='26.7' cy='73.3' r='8.5' fill='url(%23g)'/><circle cx='73.3' cy='26.7' r='8.5' fill='url(%23g)'/><circle cx='73.3' cy='50' r='8.5' fill='url(%23g)'/><circle cx='73.3' cy='73.3' r='8.5' fill='url(%23g)'/></svg>"), var(--face-grad); }

  /* Held: a ring around the die. A bordered pseudo-element (not outline) so it
     can carry the superellipse corner, offset a hair outside the die with a
     matching radius so the gap stays even at every size. Drawn on the static
     container, so it reads the same whatever face the cube landed on. */
  .die.locked::before {
    content: '';
    position: absolute; inset: calc(var(--s) * -0.055);
    border: calc(var(--s) * 0.035) solid var(--lock-ring, #4f46e5);
    border-radius: calc(var(--s) * 0.095);
    corner-shape: superellipse(2.2);
    pointer-events: none;
  }

  .lock-tag {
    position: absolute; top: calc(var(--s) * -0.1); right: calc(var(--s) * -0.1);
    width: calc(var(--s) * 0.28); height: calc(var(--s) * 0.28);
    display: grid; place-items: center;
    background: var(--lock-ring, #4f46e5); color: #fff;
    border-radius: 50%;
    box-shadow: 0 2px 5px rgba(0,0,0,.25);
    opacity: 0; transform: scale(.4); transition: opacity .2s ease, transform .2s cubic-bezier(.34,1.56,.64,1);
    pointer-events: none; z-index: 2;
  }
  .die.locked .lock-tag { opacity: 1; transform: scale(1); }
  .lock-tag svg { width: 58%; height: 58%; }

  /* ── Readout ── */
  .readout {
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px;
    min-height: 56px; margin-bottom: 12px;
  }
  .readout .hand {
    font-size: 22px; font-weight: 600; line-height: 1.1; letter-spacing: -.01em;
    min-height: 26px;
    display: flex; align-items: center; justify-content: center;
  }
  @keyframes hand-reveal {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  .readout .hand.reveal { animation: hand-reveal .28s ease both; }

  .roll-dots { display: inline-flex; gap: 7px; }
  .roll-dots i {
    width: 8px; height: 8px; border-radius: 50%;
    background: color-mix(in srgb, var(--pg-primary) 40%, transparent);
    animation: roll-bounce 1s infinite ease-in-out both;
  }
  .roll-dots i:nth-child(2) { animation-delay: .16s; }
  .roll-dots i:nth-child(3) { animation-delay: .32s; }
  @keyframes roll-bounce {
    0%, 75%, 100% { transform: translateY(0);   opacity: .45; }
    35%           { transform: translateY(-7px); opacity: 1; }
  }

  .readout .sub {
    font-size: 13px; font-weight: 500; color: var(--pg-muted);
    display: flex; align-items: center; gap: 8px;
  }
  .readout .sub .total {
    font-variant-numeric: tabular-nums;
    color: var(--pg-primary); font-weight: 600;
  }
  /* ── Controls ── */
  /* Stacked everywhere: Roll (primary) on top, New turn (reset) below. */
  .controls {
    display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: 30px;
  }
  .btn {
    -webkit-tap-highlight-color: transparent;
    font-family: inherit; font-size: 15px; font-weight: 600; letter-spacing: -.01em;
    /* Fixed width so the label (Roll / Roll again / No rolls left) never
       resizes the button mid-turn. */
    width: 156px; height: 48px; padding: 0 28px;
    border: none; border-radius: 999px;
    background: var(--pg-primary); color: var(--pg-bg);
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    transition: transform .12s ease, opacity .2s ease, filter .2s ease;
    box-shadow: 0 4px 12px rgba(0,0,0,.14);
  }
  .btn:not(:disabled):active { transform: scale(.95); }
  .btn:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }
  .btn.ghost {
    background: var(--pg-tint); color: var(--pg-primary);
    box-shadow: none; width: auto; padding: 0 20px;
  }
  /* Hover only on real pointers — on touch, :hover sticks after a tap. */
  @media (hover: hover) {
    .btn:not(:disabled):hover { filter: brightness(1.08); }
    .btn.ghost:not(:disabled):hover { background: var(--pg-tint-20); filter: none; }
  }

  @media (width < 640px) {
    .controls { margin-top: 24px; }
  }
</style>
</head>

<!-- iOS Safari only applies :active on tap if the document has a touch
     listener; this no-op enables the buttons' press-scale on touch. -->
<script>document.addEventListener('touchstart', function () {}, { passive: true });</script>
